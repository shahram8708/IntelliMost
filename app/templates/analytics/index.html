{% extends 'base.html' %}
{% block title %}Analytics - IntelliMOST{% endblock %}
{% block breadcrumb %}Analytics{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Analytics</h4>
<div class="row g-3">
  <div class="col-lg-3"><div class="kpi-card">
    <label class="form-label small fw-bold">Metric</label>
    <select id="metricSelect" class="form-select form-select-sm mb-3">
      {% for v,l in [('oee_percent','OEE'),('availability','Availability'),('performance','Performance'),('quality','Quality'),('rejection_rate','Rejection Rate'),('downtime_hours','Downtime Hours'),('output_attainment','Output Attainment')] %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
    </select>
    <label class="form-label small fw-bold">Range</label>
    <select id="daysSelect" class="form-select form-select-sm mb-3"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select>
    <label class="form-label small fw-bold">Line</label>
    <select id="lineSelect" class="form-select form-select-sm mb-3"><option value="">All lines</option>{% for l in lines %}<option value="{{ l.id }}">{{ l.line_name }}</option>{% endfor %}</select>
    <label class="form-label small fw-bold">Chart Type</label>
    <div>{% for v in ['line','bar'] %}<label class="me-2"><input type="radio" name="chartType" value="{{ v }}" {{ 'checked' if v=='line' }}> {{ v }}</label>{% endfor %}</div>
    <button id="exportChart" class="btn btn-sm btn-outline-secondary mt-3 w-100">Export Chart PNG</button>
  </div></div>
  <div class="col-lg-9">
    <div class="kpi-card mb-3"><div style="height:340px"><canvas id="analyticsChart"></canvas></div></div>
    <div class="kpi-card"><h6 class="fw-bold mb-2">Data</h6>
      <div class="table-responsive-wrap"><table class="table table-sm"><thead><tr><th>Date</th><th>Value</th></tr></thead><tbody id="dataTableBody"></tbody></table></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>{% endblock %}

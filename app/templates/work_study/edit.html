{% extends 'base.html' %}
{% block title %}Edit Study - IntelliMOST{% endblock %}
{% block breadcrumb %}Work Studies / Edit{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Edit Study</h4>
<div class="kpi-card"><form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Study Name</label><input name="study_name" class="form-control" value="{{ study.study_name }}"></div>
  <div class="mb-3"><label class="form-label">Allowance %</label><input name="allowance_percent" type="number" step="0.1" class="form-control" value="{{ study.allowance_percent }}"></div>
  <div class="mb-3"><label class="form-label">Working Conditions</label><textarea name="working_conditions" class="form-control" rows="2">{{ study.working_conditions or '' }}</textarea></div>
  <button class="btn btn-teal">Save Changes</button>
  <a href="{{ url_for('work_study.detail', id=study.id) }}" class="btn btn-outline-secondary">Cancel</a>
</form></div>
{% endblock %}
